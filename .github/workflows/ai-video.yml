# صانع فيديوهات بالذكاء الاصطناعي (MoneyPrinterTurbo)
# التشغيل: Actions → "AI Video Maker" → Run workflow → اكتب الموضوع
# المطلوب مرة وحدة: Settings → Secrets and variables → Actions → أضف
#   GEMINI_API_KEY  (مجاني: https://aistudio.google.com/app/apikey)
#   PEXELS_API_KEY  (مجاني: https://www.pexels.com/api/)
name: AI Video Maker

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "موضوع الفيديو (مثال: فوائد القهوة)"
        required: true
      language:
        description: "لغة النص"
        default: "ar"
        type: choice
        options: ["ar", "en"]
      voice:
        description: "صوت المعلّق"
        default: "ar-SA-HamedNeural-Male"
        type: choice
        options:
          - ar-SA-HamedNeural-Male
          - ar-SA-ZariyahNeural-Female
          - ar-EG-ShakirNeural-Male
          - ar-EG-SalmaNeural-Female
          - en-US-GuyNeural-Male
          - en-US-JennyNeural-Female
      aspect:
        description: "المقاس (9:16 للتيك توك/الريلز، 16:9 لليوتيوب)"
        default: "9:16"
        type: choice
        options: ["9:16", "16:9", "1:1"]
      count:
        description: "عدد الفيديوهات"
        default: "1"

env:
  MPT_REF: bdd8d328cc366fe70d9fa67ffd0443ba34b4a3e1

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download MoneyPrinterTurbo
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          git -C mpt checkout "$MPT_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mpt/requirements.txt

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          pip install -r mpt/requirements.txt
          # خط عربي للترجمة النصية
          curl -fsSL -o mpt/resource/fonts/NotoNaskhArabic-Bold.ttf \
            https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf

      - name: Write config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$PEXELS_API_KEY" ]; then
            echo "::error::أضف GEMINI_API_KEY و PEXELS_API_KEY في Settings → Secrets and variables → Actions"
            exit 1
          fi
          cd mpt
          python - <<'PY'
          import os, re
          s = open("config.example.toml", encoding="utf-8").read()
          def put(key, value):
              global s
              s, n = re.subn(rf'(?m)^{key}\s*=.*$', f'{key} = {value}', s, count=1)
              assert n == 1, key
          put("llm_provider", '"gemini"')
          put("gemini_api_key", repr(os.environ["GEMINI_API_KEY"]).replace("'", '"'))
          put("gemini_model_name", '"gemini-2.5-flash"')
          put("pexels_api_keys", '["%s"]' % os.environ["PEXELS_API_KEY"])
          put("video_source", '"pexels"')
          open("config.toml", "w", encoding="utf-8").write(s)
          PY

      - name: Make video
        working-directory: mpt
        env:
          SUBJECT: ${{ inputs.subject }}
          LANG_IN: ${{ inputs.language }}
          VOICE: ${{ inputs.voice }}
          ASPECT: ${{ inputs.aspect }}
          COUNT: ${{ inputs.count }}
        run: |
          FONT=MicrosoftYaHeiBold.ttc
          [ "$LANG_IN" = "ar" ] && FONT=NotoNaskhArabic-Bold.ttf
          python cli.py \
            --video-subject "$SUBJECT" \
            --video-language "$LANG_IN" \
            --voice-name "$VOICE" \
            --video-aspect "$ASPECT" \
            --video-count "$COUNT" \
            --video-source pexels \
            --font-name "$FONT"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ai-video
          path: mpt/storage/tasks/*/final-*.mp4
          if-no-files-found: error
